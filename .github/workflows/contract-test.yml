name: contract-test
on:
  schedule:
    - cron: "30 6 * * *"   # daily, after the 05:00 UTC trends refresh
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build
      - run: node scripts/contract-test.mjs
